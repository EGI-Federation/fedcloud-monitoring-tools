[project]
name = "fedcloud-monitoring-tools"
version = "0.3.0"
description = "Monitoring fedcloud VMs and sites"
authors = [
    { name = "Giuseppe La Rocca", email = "giuseppe.larocca@egi.eu" },
    { name = "Sebastián Luna-Valero", email = "sebastian.luna.valero@egi.eu" },
    { name = "Enol Fernández", email = "enol.fernandez@egi.eu" },
]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fedcloudclient>=1.4.4,<2",
    "ldap3>=2.9.1,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "paramiko>=3.4.0,<4",
    "IM-client>=1.8.1,<2",
    "httpx>=0.27.2,<0.28",
    "xmltodict>=0.14.2,<0.15",
    "fabric>=3.2.2,<4",
]

[project.scripts]
fedcloud-vm-monitor = "fedcloud_monitoring_tools.vm_monitor_cli:main"
fedcloud-sla-monitor = "fedcloud_monitoring_tools.sla_monitor_cli:main"
fedcloud-vo-testing = "fedcloud_monitoring_tools.vo_test_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
